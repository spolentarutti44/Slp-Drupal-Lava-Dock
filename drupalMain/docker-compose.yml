services:
  # Drupal CMS Service
  drupal1:
    image: drupal:11
    container_name: drupal1
    ports:
      - "80:80"
    volumes:
      - ./drupal-data:/opt/drupal
    environment:
      - DRUPAL_DATABASE_HOST=mariadb1
      - DRUPAL_DATABASE_PORT=3306
      - DRUPAL_DATABASE_NAME=drupaldb
      - DRUPAL_DATABASE_USER=mariadb
      - DRUPAL_DATABASE_PASSWORD=mariadb
    depends_on:
      - mariadb1
    networks:
      - app-network
    restart: unless-stopped

  # MariaDB for Drupal
  mariadb1:
    image: mariadb:10.11
    container_name: mariadb1
    volumes:
      - ./mariadb-data:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=mariadb
      - MARIADB_DATABASE=drupaldb
      - MARIADB_USER=mariadb
      - MARIADB_PASSWORD=mariadb
    networks:
      - app-network
    restart: unless-stopped

  # Laravel Application Service
  laravel:
    build:
      context: ./laravel-app
      dockerfile: Dockerfile
    container_name: laravel
    ports:
      - "8000:8000"
    volumes:
      - ./laravel-data:/var/www/html
    environment:
      - APP_NAME=ELearningPortal
      - APP_ENV=local
      - APP_KEY=base64:YourGeneratedAppKeyHere
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=laravel-db
      - DB_PORT=3306
      - DB_DATABASE=laraveldb
      - DB_USERNAME=laravel
      - DB_PASSWORD=laravel
      #- LLM_SERVICE_URL=http://ollama:11434
    depends_on:
      - laravel-db
      #- ollama
    networks:
      - app-network
    restart: unless-stopped

  # MariaDB for Laravel
  laravel-db:
    image: mariadb:10.11
    container_name: laravel-db
    volumes:
      - ./laravel-db-data:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=laravel
      - MARIADB_DATABASE=laraveldb
      - MARIADB_USER=laravel
      - MARIADB_PASSWORD=laravel
    networks:
      - app-network
    restart: unless-stopped

  # Ollama LLM Service - Commented out (uncomment when ready to use)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./ollama-data:/root/.ollama
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0:11434
  #   networks:
  #     - app-network
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

  # Database Administration Tool
  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      - mariadb1
      - laravel-db
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  drupal-data:
  mariadb-data:
  laravel-data:
  laravel-db-data:
  ollama-data: